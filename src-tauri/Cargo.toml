[package]
name = "mdviewer"
description = "Lightweight Markdown viewer and editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdcore.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Embed the built UI (ui/dist) instead of loading the Vite dev server.
# `npm run tauri build` enables it automatically; plain `cargo build` needs `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
