# Monthly dependency updates, grouped to keep the PR count low.
# Tauri: keep the Rust crate `tauri` and npm `@tauri-apps/*` on the same minor version
# (CI's Windows job runs `tauri build`, which fails on a mismatch).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      tauri: { patterns: ["@tauri-apps/*"] }
      npm-dependencies: { patterns: ["*"] }
    ignore:
      # Mermaid 12 re-lays out and recolours existing diagrams, bundles elkjs (EPL-2.0)
      # and grows the exe. Upgrade deliberately in its own PR; 11.x updates still come.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      tauri: { patterns: ["tauri", "tauri-*"] }
      cargo-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
