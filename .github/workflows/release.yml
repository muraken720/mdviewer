name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check that the tag matches the version everywhere
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$npm" -ne "${{ github.ref_name }}" -or $tauri -ne $npm -or $cargo -ne $npm) {
            throw "Version mismatch: tag=${{ github.ref_name }} package.json=$npm tauri.conf.json=$tauri Cargo.toml=$cargo"
          }
      - run: npm ci
      - name: Build exe and installer
        run: npm run tauri build
      - name: Package the portable zip (exe + licenses)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          $staging = "mdviewer_${version}_x64_portable"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item target/release/mdviewer.exe, THIRD_PARTY_LICENSES.md $staging/
          Copy-Item LICENSE "$staging/LICENSE.txt"
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$staging.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdviewer-windows
          path: dist/*

  # Only this job can write to the repository, and it runs no build code.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mdviewer-windows
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            *-setup.exe
            *_portable.zip
