[workspace]
resolver = "2"
members = ["crates/mdcore", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Kenichiro Murata"]
repository = "https://github.com/muraken720/mdviewer"

[workspace.dependencies]
mdcore = { path = "crates/mdcore" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
